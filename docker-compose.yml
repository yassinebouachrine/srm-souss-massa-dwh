# ============================================================
# SRM Souss-Massa - Docker Compose pour Airflow
# ============================================================
# Basé sur la configuration officielle Apache Airflow 2.8.1
# Compatible Windows avec Docker Desktop
# ============================================================

version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1-python3.10
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Connexion vers votre PostgreSQL local (pour les DAGs)
    # Note : host.docker.internal permet d'accéder à localhost depuis Docker
    AIRFLOW_CONN_POSTGRES_SRM: postgresql://postgres:1342@host.docker.internal:5432/srm_datawarehouse
  volumes:
    - ./airflow_home/dags:/opt/airflow/dags
    - ./airflow_home/logs:/opt/airflow/logs
    - ./airflow_home/plugins:/opt/airflow/plugins
    - ./notebooks:/opt/airflow/notebooks
    - ./etl:/opt/airflow/etl
    - ./data:/opt/airflow/data
  user: "50000:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # ============================================================
  # PostgreSQL dédié à Airflow (metadata)
  # ============================================================
  postgres-airflow:
    image: postgres:15
    container_name: srm_postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Port 5433 pour ne pas conflicter avec votre PostgreSQL 17
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ============================================================
  # Airflow Init (initialisation base + admin)
  # ============================================================
  airflow-init:
    <<: *airflow-common
    container_name: srm_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//./ }
        }
        airflow_version=$$(gosu airflow airflow version)
        airflow_version_comparable=$$(ver $${airflow_version})
        min_airflow_version=2.2.0
        min_airflow_version_comparable=$$(ver $${min_airflow_version})
        if (( airflow_version_comparable < min_airflow_version_comparable )); then
          echo
          echo -e "\033[1;31mERROR!!!: Too old Airflow version $${airflow_version}!\e[0m"
          exit 1
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "50000:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname SRM \
          --role Admin \
          --email admin@srm.ma \
          --password admin123
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin123
    user: "0:0"
    volumes:
      - ./airflow_home:/sources

  # ============================================================
  # Airflow Webserver (Interface Web)
  # ============================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: srm_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================================
  # Airflow Scheduler
  # ============================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: srm_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-airflow-data:
    name: srm_postgres_airflow_data