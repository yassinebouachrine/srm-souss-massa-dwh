version: '3.8'

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  env_file:
    - .env.docker
  environment:
    &airflow-common-env
    _AIRFLOW_DB_UPGRADE: 'true'
    _AIRFLOW_WWW_USER_CREATE: 'true'
    _AIRFLOW_WWW_USER_USERNAME: 'admin'
    _AIRFLOW_WWW_USER_PASSWORD: '1342'
    _AIRFLOW_WWW_USER_ROLE: 'Admin'
    _AIRFLOW_WWW_USER_EMAIL: 'admin@srm.ma'
    _AIRFLOW_WWW_USER_FIRSTNAME: 'Admin'
    _AIRFLOW_WWW_USER_LASTNAME: 'SRM'
  volumes:
    # On monte tes dossiers locaux directement dans le conteneur
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./etl:/opt/airflow/etl
    - ./data:/opt/airflow/data
    - ./database:/opt/airflow/database
    - ./scripts:/opt/airflow/scripts
    - ./streamlit_app:/opt/airflow/streamlit_app
  depends_on:
    postgres:
      condition: service_healthy

services:
  # 1. Base de données unifiée (Airflow + DWH)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: srm_admin
      POSTGRES_PASSWORD: 1342
      # Un script d'initialisation créera les bases multiples (airflow et DWH)
      POSTGRES_MULTIPLE_DATABASES: airflow,srm_datawarehouse
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "srm_admin"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    ports:
      - "5432:5432" # Expose le port pour que tu puisses t'y connecter depuis DBeaver/PBI localement

  # 2. Initialisation Airflow (s'exécute 1 fois au démarrage)
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
    user: "0:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  # 3. Le Scheduler (Moteur d'exécution)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 4. Interface Web Airflow
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully



  # 5. Application Streamlit (Saisie des indicateurs & réclamations)
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    env_file:
      - .env.docker
    ports:
      - "8501:8501"
    volumes:
      # Montage en volume : si tu modifies un fichier dans streamlit_app/ sur ton PC, 
      # ça se mettra à jour en temps réel dans Docker !
      - ./streamlit_app:/app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-db-volume: