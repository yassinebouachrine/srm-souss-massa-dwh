# ═══════════════════════════════════════════════════════════════
# Configuration globale ETL - SRM Souss-Massa
# ═══════════════════════════════════════════════════════════════

paths:
  data_root: "data"
  raw: "data/raw"
  bronze: "data/bronze"
  silver: "data/silver"
  rejects: "data/rejects"
  logs: "data/logs"

database:
  schema_dwh: "dwh"
  schema_staging: "app_staging"
  schema_auth: "app_auth"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)-30s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file_rotation_mb: 10
  file_backup_count: 5

sources:
  indicateurs_reclamations:
    raw_folder: "indicateurs_reclamations"
    file_pattern: "*.xlsx"
    source_saisie: "excel_legacy"
    
    # Structure des onglets
    onglet_recap: "Recap DP"          # onglet d'agrégation DP (sans centre)
    
    # Position des blocs dans les onglets (0-indexed)
    bloc_indicateurs:
      header_row: 0                   # ligne 1 = header
      data_start_row: 1               # données commencent ligne 2
      data_end_row: 22                # données finissent ligne 22 (exclusive = 22, donc jusqu'à ligne 22 inclus)
    
    bloc_reclamations:
      header_row: 23                  # ligne 24 = header réclamations
      data_start_row: 24              # données commencent ligne 25
      data_end_row: 34                # données finissent ligne 34
    
    # Colonnes à ignorer (calculées dans Excel, pas de vraies données)
    colonnes_ignorer_pattern: "recap"  # ex: "Récap 2025", "récap 2026"

  
  streamlit_indicateurs_reclamations:
    source_saisie: "streamlit"
    schema_source: "app_staging"
    table_indicateurs: "staging_indicateurs_dp"
    table_reclamations: "staging_reclamations_dp"
    # Filtre : uniquement les lots validés au niveau régional
    statut_a_charger: "valide_regional"