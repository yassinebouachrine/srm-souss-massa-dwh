# ═══════════════════════════════════════════════════════════════
# Configuration métier PCWIN
# Alignée sur la logique Power Query de Fact_Pcwin_Mesures
# ═══════════════════════════════════════════════════════════════

# ─── Détection de la voie depuis le libellé + unité ───
# Ordre : keyword libellé (priorité 1) → unité (priorité 2) → AUTRE
voie_detection:
  pression:
    keywords:
      - "pression"
      - "press"
    unites:
      - "bar"
      - "mbar"
      - "m"
  debit:
    keywords:
      - "debit"
      - "débit"
      - "flow"
    unites:
      - "m3/h"
      - "m3/hr"
      - "l/s"
      - "cum/hr"
  index:
    keywords:
      - "comptage"
      - "index"
      - "cumul"
    unites:
      - "m3"
      - "cum"
  volume:
    keywords_all:  # doit contenir TOUS les mots
      - ["volume", "journalier"]
      - ["vol", "journ"]
    unites:
      - "m3"

# ─── Canal_Affichage (plus fin que voie) ───
# Détection en cascade
canal_affichage_detection:
  # Priorité 1 : cas spécifiques
  PRESSION:
    keywords: ["pression"]
    unites: ["bar", "m"]
  VOLUME_JOURNALIER:
    keywords_all:
      - ["volume", "journalier"]
  DEBIT_MIN_JOURNALIER:
    keywords_all:
      - ["debit", "min"]
      - ["débit", "min"]
      - ["debit", "minimum"]
      - ["débit", "minimum"]
  DEBIT:
    keywords: ["debit", "débit"]
    unites: ["m3/h"]
  INDEX:
    keywords: ["comptage", "index"]
  AUTRE: {}

# ─── Nature_Mesure (sémantique métier) ───
nature_mesure_detection:
  VOLUME_JOURNALIER_CALCULE:
    keywords_all:
      - ["volume", "journalier"]
  DEBIT_MIN_JOURNALIER_CALCULE:
    keywords_all:
      - ["debit", "min"]
      - ["débit", "min"]
      - ["debit", "minimum"]
      - ["débit", "minimum"]
  INDEX_CUMULATIF:
    keywords: ["comptage", "index"]
  DEBIT_INSTANTANE:
    keywords: ["debit", "débit"]
    unites: ["m3/h"]
  PRESSION_INSTANTANEE:
    keywords: ["pression"]
    unites: ["bar"]
  AUTRE: {}

# ─── Granularité ───
granularite_detection:
  JOURNALIER:
    keywords: ["journalier", "jour"]
  INSTANTANE: {}  # default

# ─── Détection amont/aval (pour modulateurs) ───
amont_aval_detection:
  amont_keywords:
    - "amont"
    - "inlet"
    - "entree"
    - "entrée"
  aval_keywords:
    - "aval"
    - "outlet"
    - "sortie"

# ─── Règles de qualité (seuils) ───
qualite_regles:
  pression:
    min_normal: 0
    max_normal: 20     # bar (PCWIN semble être en bar contrairement à PMAC)
    max_absolu: 100
  debit:
    min_normal: 0
    max_normal: 5000
    max_absolu: 50000
  index:
    min_normal: 0
    max_normal: 999999999999
    max_absolu: 999999999999
  volume:
    min_normal: 0
    max_normal: 100000
    max_absolu: 1000000